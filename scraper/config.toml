# northbound scraper config
# Bad slugs are skipped and logged, so it's safe to add guesses.
# Run `python3.13 scraper/check_sources.py` to see which entries work.

[filters]
# A posting is kept only if its title matches one of these (case-insensitive, word-ish match)
title_include = ["intern", "internship", "co-op", "coop", "co op", "student", "work term"]
# ...and none of these
title_exclude = ["internal", "international", "internist", "phd", "mba", "senior", "staff", "principal", "manager,"]
# Drop postings first seen more than this many days ago (keeps the JSON small)
max_age_days = 120
# Postings that only list terms before this one are dropped. Spring counts as Winter (Jan-Apr).
# Postings with no term listed are always kept.
earliest_term = "Winter 2027"
# Which regions to collect. Options: "Canada", "US", "Remote" (remote with no country named)
regions = ["Canada", "US", "Remote"]

[alerts]
# Only alert about these categories. Options: Software, Data & ML, Product, Hardware, Quant, Other
categories = ["Software", "Data & ML", "Product"]
# Which regions to alert on. US adds a lot of mail, so it's off by default. Add "US" to opt in.
regions = ["Canada", "Remote"]
# Max lines in a text message (emails list up to 25)
max_lines = 6

# Community-maintained lists on GitHub (huge coverage, updated constantly)
[[github_lists]]
name = "Simplify Summer 2027"
url = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"

# (Simplify's Summer2026 repo serves the same listings, so one list is enough)

[[github_lists]]
name = "CSCareers (vanshb03)"
url = "https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json"

# README tables. Columns are matched by header (Company, Role/Position, Location, Salary, Apply/Posting, Age/Date)
[[markdown_lists]]
name = "SpeedyApply US"
url = "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md"

[[markdown_lists]]
name = "SpeedyApply International"
url = "https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/INTERN_INTL.md"

[[markdown_lists]]
name = "SpeedyApply AI/ML"
url = "https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md"

[[markdown_lists]]
name = "Canadian Tech Internships (negarprh)"
url = "https://raw.githubusercontent.com/negarprh/Canadian-Tech-Internships-2027/main/README.md"

# Direct company career boards. These catch roles before the lists do.
[ats]
greenhouse = ["stripe", "databricks", "cloudflare", "figma", "faire", "samsara", "dropbox", "affirm",
              "pinterest", "airbnb", "okta", "coinbase", "robinhood", "lyft", "instacart", "doordashusa", "hootsuite",
              "anthropic", "scaleai", "roblox", "discord", "reddit", "duolingo", "datadog", "mongodb", "asana",
              "brex", "verkada", "twitch", "gitlab", "elastic"]
lever = []
ashby = ["cohere", "ramp", "notion", "linear", "1password", "snowflake", "wealthsimple", "openai", "plaid"]
smartrecruiters = ["BoschGroup"]

# amazon.jobs public search (Vancouver and Toronto tech hubs)
amazon = true

