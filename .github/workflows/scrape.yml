name: Scrape postings

on:
  schedule:
    # Every 30 minutes, at :07 and :37 (GitHub's :00 slots are crowded and run late)
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        env:
          NB_TZ: America/Vancouver
          BOARD_URL: https://northbound-jobs.netlify.app
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper/scrape.py

      - name: Commit new data
        run: |
          if git diff --quiet -- public/data/postings.json scraper/state && [ -z "$(git ls-files --others --exclude-standard scraper/state)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "northbound-bot"
          git config user.email "northbound-bot@users.noreply.github.com"
          git add public/data/postings.json scraper/state
          git commit -m "data: refresh postings [skip netlify]"
          git pull --rebase --autostash
          git push
