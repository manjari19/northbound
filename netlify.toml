[build]
  command = "npm run build"
  publish = "out"
  # Data-only commits from the scraper don't need a rebuild: the site reads postings straight from GitHub
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)public/data' ':(exclude)scraper/state'"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_DATA_URL = "https://raw.githubusercontent.com/manjari19/northbound/main/public/data/postings.json"
